name: Foundation release gates

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

defaults:
  run:
    working-directory: caloreazi

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caloreazi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d caloreazi_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CALOREAZI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/caloreazi_test
      CALOREAZI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/caloreazi_test
      CALOREAZI_DATA_DIR: /tmp/caloreazi-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caloreazi/package-lock.json
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run lint
      - run: npm run test:integration
      - name: Prove normalized persistence
        run: |
          test "$(psql "$CALOREAZI_DATABASE_URL" -Atc "SELECT to_regclass('public.runtime_state') IS NULL")" = "t"
          test "$(psql "$CALOREAZI_DATABASE_URL" -Atc "SELECT COUNT(*) FROM users")" -ge 2
          test "$(psql "$CALOREAZI_DATABASE_URL" -Atc "SELECT COUNT(*) FROM meals")" -ge 1
      - name: Build Home Assistant image
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.22 -t caloreazi-foundation:test .
